<script src="assets/gallery-data.js"></script>
<script>
(function(){
  const wall = document.getElementById('wall');
  const empty = document.getElementById('empty');
  const filters = document.getElementById('filters');

  const tagbar = document.getElementById('tagbar');
  let activeTag = null;

  function render(cat){
    wall.innerHTML = '';
    const items = GALLERY.filter(g => (cat === 'all' || g.cat === cat) && (!activeTag || (g.tags || []).includes(activeTag)));
    tagbar.hidden = !activeTag;
    if (activeTag) tagbar.innerHTML = 'Showing ' + ((typeof TAG_LABELS !== 'undefined' && TAG_LABELS[activeTag]) || activeTag) + ' &mdash; <a href="#" id="cleartag">show everything</a>';
    if (!items.length){ empty.hidden = false; return; }
    empty.hidden = true;
    for (const g of items){
      const fig = document.createElement('figure');
      fig.className = 'shot';
      if (g.type === 'video'){
        const v = document.createElement('video');
        v.src = g.src; v.controls = true; v.preload = 'metadata';
        if (g.poster) v.poster = g.poster;
        fig.appendChild(v);
      } else {
        const i = document.createElement('img');
        const t = g.src.replace('media/2026/', 'media/thumbs/');
        const b = t.replace(/\?.*$/, '').replace(/\.jpg$/, '');
        i.src = t;
        // Let the browser pick a file near the column width. Handed only the 800px thumb it
        // reduced by ~2x in the wall, and that beat against the scanlines on the lit-CRT shots.
        i.srcset = b + '-400.jpg 400w, ' + b + '-600.jpg 600w, ' + t + ' 800w';
        i.sizes = '(max-width:560px) calc(100vw - 38px), (max-width:900px) calc((100vw - 44px)/2), (max-width:1200px) calc((100vw - 50px)/3), 383px';
        i.dataset.full = g.src;
        i.alt = g.title || ''; i.loading = 'lazy'; i.decoding = 'async';
        if (g.w && g.h){ i.width = g.w; i.height = g.h; }
        fig.appendChild(i);
      }
      const cap = document.createElement('figcaption');
      cap.innerHTML = '<b>' + (g.title||'') + '</b>' +
        (g.caption ? ' — ' + g.caption : '') +
        '<span class="cat">' + g.cat + '</span>';
      fig.appendChild(cap);
      wall.appendChild(fig);
    }
  }

  function setOn(cat){
    filters.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.cat === cat));
  }
  // Filter state lives in the hash so a category or a machine tag can be linked to:
  // gallery.html#pinball, gallery.html#tag=big-blue.
  function fromHash(){
    const h = location.hash.replace(/^#/, '');
    const m = h.match(/^tag=([a-z0-9-]+)$/);
    activeTag = m ? m[1] : null;
    const cats = Array.from(filters.querySelectorAll('button')).map(b => b.dataset.cat);
    const cat = (!m && cats.includes(h)) ? h : 'all';
    setOn(cat);
    render(cat);
  }
  filters.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    activeTag = null;
    const cat = b.dataset.cat;
    history.replaceState(null, '', cat === 'all' ? location.pathname : '#' + cat);
    setOn(cat);
    render(cat);
  });
  tagbar.addEventListener('click', e => {
    if (!e.target.closest('#cleartag')) return;
    e.preventDefault();
    history.replaceState(null, '', location.pathname);
    fromHash();
  });
  window.addEventListener('hashchange', fromHash);

  fromHash();
})();
</script>
