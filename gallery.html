<script src="assets/gallery-data.js"></script>
<script>
(function(){
  const wall = document.getElementById('wall');
  const empty = document.getElementById('empty');
  const filters = document.getElementById('filters');

  function render(cat){
    wall.innerHTML = '';
    const items = GALLERY.filter(g => cat === 'all' || g.cat === cat);
    if (!items.length){ empty.hidden = false; return; }
    empty.hidden = true;
    for (const g of items){
      const fig = document.createElement('figure');
      fig.className = 'shot';
      if (g.type === 'video'){
        const v = document.createElement('video');
        v.src = g.src; v.controls = true; v.preload = 'metadata';
        if (g.poster) v.poster = g.poster;
        fig.appendChild(v);
      } else {
        const i = document.createElement('img');
        i.src = g.src.replace('media/2026/', 'media/thumbs/');
        i.dataset.full = g.src;
        i.alt = g.title || ''; i.loading = 'lazy'; i.decoding = 'async';
        if (g.w && g.h){ i.width = g.w; i.height = g.h; }
        fig.appendChild(i);
      }
      const cap = document.createElement('figcaption');
      cap.innerHTML = '<b>' + (g.title||'') + '</b>' +
        (g.caption ? ' — ' + g.caption : '') +
        '<span class="cat">' + g.cat + '</span>';
      fig.appendChild(cap);
      wall.appendChild(fig);
    }
  }

  filters.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filters.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    render(b.dataset.cat);
  });

  render('all');
})();
</script>
