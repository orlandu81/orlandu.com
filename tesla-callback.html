<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tesla sign-in complete</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0f; color: #eee; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: #aaa; margin: .5rem 0; }
  code { display: block; margin: 1.2rem 0; padding: 1rem; background: #17171f; border: 1px solid #333; border-radius: .5rem; word-break: break-all; font-size: 1rem; color: #fff; user-select: all; }
  button { font: inherit; padding: .7rem 1.4rem; border: 0; border-radius: .5rem; background: #e33; color: #fff; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .ok { color: #6c6; }
</style>
</head>
<body>
<main>
  <h1>Tesla sign-in complete</h1>
  <p>Copy this code and paste it into the Tidbyt setup window on the laptop.</p>
  <code id="code">(no code in the address bar)</code>
  <button id="copy" type="button">Copy code</button>
  <p id="msg"></p>
</main>
<script>
  var p = new URLSearchParams(location.search), c = p.get("code");
  var el = document.getElementById("code"), msg = document.getElementById("msg");
  if (c) { el.textContent = c; }
  document.getElementById("copy").onclick = function () {
    if (!c) { return; }
    navigator.clipboard.writeText(c).then(function () { msg.textContent = "Copied."; msg.className = "ok"; },
      function () { msg.textContent = "Select the code and copy it by hand."; });
  };
</script>
</body>
</html>
